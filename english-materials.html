<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="IELTS Core computer-delivered IELTS practice tests, passage drills, and study library">
  <title>Practice & Test Library | IELTS Core</title>
  <script>document.documentElement.dataset.theme=localStorage.getItem('vortex-english-theme')==='dark'?'dark':'light'</script>
  <script>if(!localStorage.getItem('vortex-english-token'))location.replace('/english/login?next='+encodeURIComponent(location.pathname+location.search))</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <link rel="stylesheet" href="/english-pages.css?v=20260822_500">
  <link rel="stylesheet" href="/english-product-v4.css?v=20260822_500">
  <link rel="stylesheet" href="/english-catalog.css?v=20260911_03">
  <link rel="stylesheet" href="/english-internal-premium.css?v=20260911_03">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-framed.svg">
</head>
<body class="materials-page member-layout">
  <!-- Main Catalog Shell -->
  <div class="vx-catalog-shell">
    <!-- Main Content Panel -->
    <main class="vx-catalog-main">

      <!-- Breadcrumb Navigation -->
      <nav class="vx-catalog-breadcrumb" aria-label="Breadcrumb">
        <a href="/english"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:text-bottom;">home</span> Home</a>
        <span class="sep">&gt;</span>
        <span class="current" id="vxBreadcrumbCurrent">Reading Passages</span>
      </nav>

      <!-- Category Header Banner -->
      <div class="vx-cat-header-wrap">
        <div class="vx-cat-icon-badge material-symbols-outlined" id="vxCatIconBadge">menu_book</div>
        <div class="vx-cat-title-block">
          <h1 class="vx-cat-title" id="vxCategoryTitle">Reading Passages</h1>
          <p class="vx-cat-subtitle" id="vxCategorySubtitle">Practice individual reading passages with various question types</p>
        </div>
      </div>

      <!-- Search Row -->
      <div class="vx-search-row">
        <div class="vx-search-input-wrap">
          <span class="material-symbols-outlined vx-search-icon">search</span>
          <input type="search" class="vx-search-input" id="materialSearch" placeholder="Search reading passages..." autocomplete="off">
          <button type="button" class="vx-search-clear" id="clearSearchInput" hidden aria-label="Clear search">×</button>
        </div>
        <button type="button" class="vx-search-btn" id="materialSearchBtn">
          <span class="material-symbols-outlined" style="font-size:18px;">search</span>
          <span>Search</span>
        </button>
      </div>

      <!-- Filters Row -->
      <div class="vx-filters-row">
        <select id="filterPassage" class="vx-filter-select" aria-label="Filter by passage">
          <option value="all">All Passages</option>
          <option value="1">Passage 1</option>
          <option value="2">Passage 2</option>
          <option value="3">Passage 3</option>
        </select>
        <select id="filterStatus" class="vx-filter-select" aria-label="Filter by completion status">
          <option value="all">All Status</option>
          <option value="completed">Completed</option>
          <option value="not-started">Not Started</option>
        </select>
        <select id="filterType" class="vx-filter-select" aria-label="Filter by question type">
          <option value="all">All Types</option>
          <option value="tfng">True / False / Not Given</option>
          <option value="headings">Matching Headings</option>
          <option value="completion">Completion / Gap Fill</option>
          <option value="mcq">Multiple Choice</option>
        </select>
        <select id="filterPlan" class="vx-filter-select" aria-label="Filter by plan">
          <option value="all">All Plans</option>
          <option value="free">Free Practice</option>
          <option value="premium">Premium</option>
        </select>
      </div>

      <!-- Results Count Bar -->
      <div class="vx-results-count-bar">
        <span id="resourceCount">Loading tests...</span>
        <button type="button" class="vx-reset-link" id="clearMaterialFilters" hidden>Reset all filters</button>
      </div>

      <!-- 3-Column Responsive Cards Grid -->
      <section class="vx-cards-grid" id="resourceList" aria-live="polite" aria-busy="true">
        <div class="vx-skeleton-card"></div>
        <div class="vx-skeleton-card"></div>
        <div class="vx-skeleton-card"></div>
      </section>
    </main>
  </div>

  <script src="/english-site.js?v=20260911_03"></script>
  <script src="/english-materials.js?v=20260911_03"></script>
</body>
</html>
