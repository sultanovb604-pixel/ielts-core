version: '3.8'

services:
  app:
    build: .
    container_name: ielts-core-app
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
      - PORT=4173
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ./data:/app/data
