<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IELTS Core - Telegram Avatar</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { background: #1e293b; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
    canvas { display: none; }
    .preview-container {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        overflow: hidden;
        margin-bottom: 20px;
    }
    img { width: 100%; height: 100%; object-fit: cover; }
    .instruction { font-size: 16px; color: #94a3b8; margin-bottom: 20px; text-align: center;}
    a { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; background: #1468f3; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 18px; transition: 0.2s; box-shadow: 0 10px 20px rgba(20, 104, 243, 0.3); cursor: pointer; }
    a:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(20, 104, 243, 0.4); }
  </style>
</head>
<body>
  <canvas id="c" width="1024" height="1024"></canvas>
  <div class="preview-container">
    <img id="out" src="" alt="Avatar Preview">
  </div>
  <div class="instruction">Mana tayyor! Bu Telegramda shunday dumaloq turadi.<br><br><b>Rasmni ustiga o'ng tugmani bosib 'Save image as' qilib ham olishingiz mumkin.</b></div>
  <a id="download" download="ielts-core-telegram.png">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Profil rasmini yuklab olish
  </a>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(1, '#020617');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 1024);
    }

    const img = new Image();
    img.onload = () => {
      document.fonts.ready.then(() => {
          drawBackground();
    
          const logoSize = 420;
          const x = (1024 - logoSize) / 2;
          const y = (1024 - logoSize) / 2 - 100;
    
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = 1024;
          tempCanvas.height = 1024;
          const tCtx = tempCanvas.getContext('2d');
          
          tCtx.drawImage(img, x, y, logoSize, logoSize);
          tCtx.globalCompositeOperation = 'source-in';
          tCtx.fillStyle = '#ffffff';
          tCtx.fillRect(0, 0, 1024, 1024);
    
          ctx.drawImage(tempCanvas, 0, 0);
    
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 100px "Montserrat", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText('IELTS CORE', 512, y + logoSize + 40);
          
          ctx.fillStyle = '#38bdf8';
          ctx.font = '700 42px "Montserrat", sans-serif';
          ctx.fillText('A I   P L A T F O R M', 512, y + logoSize + 170);
    
          const dataUrl = canvas.toDataURL('image/png');
          document.getElementById('out').src = dataUrl;
          document.getElementById('download').href = dataUrl;
      });
    };
