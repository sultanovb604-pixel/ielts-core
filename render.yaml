services:
  - type: web
    name: ielts-core
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Bunyod@2026!
      - key: SESSION_SECRET
        value: vortex-session-secret-2026-ielts-core
