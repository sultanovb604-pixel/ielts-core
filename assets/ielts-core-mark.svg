  <!-- Bottom-right facet -->
  <path d="M32 22L24 30L24 24.4L28.4 20L32 22Z" fill="#1d4ed8"/>

  <!-- Interlocking Weave Center Overlay -->
  <!-- Top Cross: Left Loop Over Right -->
  <path d="M16 14L18 12L20 14L18 16L16 14Z" fill="#1e293b"/>
  <!-- Bottom Cross: Right Loop Over Left -->
  <path d="M16 22L18 20L20 22L18 24L16 22Z" fill="#2563eb"/>
</svg>