      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vxSlateBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vxBlueTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vxBlueBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Left Loop (Slate/Obsidian) -->
  <!-- Top-left facet -->
  <path d="M12 6L14.8 8.8L8 15.6L4 14L12 6Z" fill="#475569"/>
  <!-- Top-right facet -->
  <path d="M12 6L20 14L16 18L12 14L14.8 11.2L12 8.4L12 6Z" fill="url(#vxSlateTop)"/>
  <!-- Bottom-left facet -->
  <path d="M4 14L4 22L12 30L12 24.4L7.6 20L8 15.6L4 14Z" fill="url(#vxSlateBottom)"/>
  <!-- Bottom-right facet (under pass) -->
  <path d="M12 30L20 22L16 18L12 22L12 24.4L12 30Z" fill="#0f172a"/>

  <!-- Right Loop (Cobalt/Azure) -->
  <!-- Top-left facet (under pass) -->
  <path d="M24 6L16 14L20 18L24 14L21.2 11.2L24 8.4L24 6Z" fill="url(#vxBlueTop)"/>
  <!-- Top-right facet -->
  <path d="M24 6L32 14L32 22L28 20L28 15.6L24 11.6L24 6Z" fill="#38bdf8"/>
